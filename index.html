<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sugestões de projetos por coleção · Dive.b 2027</title>
  <!-- Carregamento externo exclusivo dos dados (118 projetos, anos, segmentos e 219 códigos BNCC) -->
  <script src="dados_dive_b.js"></script>
  <style>
    /* ==========================================================================
       1. TIPOGRAFIA E VARIÁVEIS DE MARCA (MANUAL DE MARCA DIVE.B)
       ========================================================================== */
    @font-face {
      font-family: 'Suspire';
      src: url('fonts/SuspireTest-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Suspire';
      src: url('fonts/SuspireTest-Italic.ttf') format('truetype');
      font-weight: 400;
      font-style: italic;
      font-display: swap;
    }
    @font-face {
      font-family: 'Suspire';
      src: url('fonts/SuspireTest-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Suspire';
      src: url('fonts/SuspireTest-ExtraBold.ttf') format('truetype');
      font-weight: 800;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Suspire';
      src: url('fonts/SuspireTest-Black.ttf') format('truetype');
      font-weight: 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --navy: #2B357F;
      --navy-dark: #1E255E;
      --anil: #798ED0;
      --anil-dark: #4D63B0;
      --teal: #2A6E81;
      --green: #73CC7D;
      --green-text: #2F8A3C;
      --coral: #F14A5B;
      --coral-dark: #D63445;
      --lemon: #B3DC2F;
      --cream: #FFFFF5;
      --surface: #FFFFFF;
      --surface-alt: #F7F7EC;
      --text-main: #22284F;
      --text-sec: #5A6085;
      --border: #E3E3D8;
      --shadow-sm: 0 2px 8px rgba(34, 40, 79, 0.05);
      --shadow-md: 0 8px 24px rgba(34, 40, 79, 0.09);
      --shadow-lg: 0 16px 40px rgba(34, 40, 79, 0.16);
      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-lg: 20px;
      --font-sans: 'Suspire', 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    /* ==========================================================================
       2. RESET E ESTILOS BASE
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    body {
      margin: 0;
      background-color: var(--cream);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-weight: 400;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4 {
      margin: 0;
      font-weight: 800;
      line-height: 1.25;
      color: var(--navy);
    }

    button, input, select {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    :focus-visible {
      outline: 3px solid var(--navy);
      outline-offset: 2px;
    }

    mark {
      background-color: var(--lemon);
      color: var(--navy);
      padding: 0 3px;
      border-radius: 4px;
      font-weight: 700;
    }

    [hidden] { display: none !important; }
    .mobile-filters-backdrop { display: none; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Tela de erro caso dados_dive_b.js não esteja disponível */
    .data-error-box {
      max-width: 560px;
      margin: 72px auto;
      padding: 32px 28px;
      background: var(--surface);
      border: 2px solid var(--coral);
      border-radius: var(--radius-lg);
      text-align: center;
      box-shadow: var(--shadow-md);
    }
    .data-error-box h2 {
      color: var(--coral-dark);
      margin-bottom: 10px;
      font-size: 1.3rem;
    }
    .data-error-box p {
      margin: 0;
      color: var(--text-sec);
      font-size: 0.95rem;
    }

    /* ==========================================================================
       3. CABEÇALHO FIXO E DECORAÇÃO ORGÂNICA
       ========================================================================== */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 245, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }

    .header-deco {
      position: absolute;
      right: -10px;
      top: -10px;
      width: 140px;
      height: 140px;
      pointer-events: none;
      opacity: 0.16;
      z-index: 0;
    }

    .header-inner {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 24px;
      max-width: 1440px;
      margin: 0 auto;
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .brand-logo {
      height: 44px;
      width: auto;
      max-width: 170px;
      object-fit: contain;
      display: block;
      flex-shrink: 0;
    }

    .brand-titles {
      min-width: 0;
    }

    .brand-kicker {
      display: block;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--teal);
    }

    .brand-title {
      font-size: 1.18rem;
      font-weight: 900;
      color: var(--navy);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-box {
      position: relative;
      flex: 1 1 260px;
      max-width: 400px;
    }

    .search-box svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--text-sec);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 10px 44px 10px 42px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--navy);
      box-shadow: 0 0 0 3px rgba(43, 53, 127, 0.12);
    }

    .search-kbd {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1px 6px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-sec);
      pointer-events: none;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 14px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--navy);
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .nav-pill:hover {
      border-color: var(--navy);
      background: var(--surface-alt);
    }

    .nav-pill.active {
      background: var(--navy);
      color: #FFFFFF;
      border-color: var(--navy);
    }

    .new-tab-link {
      border-style: dashed;
      border-color: var(--teal);
      color: var(--teal);
    }

    .new-tab-link:hover {
      background: #EAF4F7;
      border-color: var(--teal);
    }

    .badge-count {
      background: var(--lemon);
      color: var(--navy);
      font-size: 0.78rem;
      font-weight: 800;
      padding: 1px 7px;
      border-radius: 999px;
    }

    .lang-switch {
      display: inline-flex;
      background: var(--surface-alt);
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: 2px;
    }

    .lang-btn {
      border: none;
      background: transparent;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--text-sec);
      transition: all 0.15s;
    }

    .lang-btn.active {
      background: var(--navy);
      color: #FFFFFF;
    }

    /* ==========================================================================
       4. NAVEGAÇÃO POR SEGMENTO E CHIPS DE ANOS
       ========================================================================== */
    .segment-nav-wrap {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 0;
    }

    .segment-tabs {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    .seg-tab {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      padding: 14px 16px;
      border-radius: var(--radius-md);
      border: 2px solid var(--border);
      background: var(--cream);
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
      position: relative;
      overflow: hidden;
    }

    .seg-tab:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    .seg-tab-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 4px;
    }

    .seg-dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      display: inline-block;
    }

    .seg-count {
      font-size: 0.78rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(34, 40, 79, 0.08);
      color: var(--text-main);
    }

    .seg-tab-title {
      font-size: 0.98rem;
      font-weight: 800;
      line-height: 1.2;
    }

    .seg-tab-sub {
      font-size: 0.78rem;
      opacity: 0.85;
      margin-top: 2px;
    }

    /* Estados ativos com contraste AA garantido */
    .seg-tab.active[data-seg="all"] {
      background: var(--navy);
      border-color: var(--navy);
      color: #FFFFFF;
    }
    .seg-tab.active[data-seg="ei"] {
      background: var(--coral-dark);
      border-color: var(--coral-dark);
      color: #FFFFFF;
    }
    .seg-tab.active[data-seg="efai"] {
      background: var(--green);
      border-color: var(--green-text);
      color: var(--navy);
    }
    .seg-tab.active[data-seg="efaf"] {
      background: var(--anil-dark);
      border-color: var(--anil-dark);
      color: #FFFFFF;
    }
    .seg-tab.active[data-seg="em"] {
      background: var(--teal);
      border-color: var(--teal);
      color: #FFFFFF;
    }

    .seg-tab.active .seg-count {
      background: rgba(255, 255, 255, 0.24);
      color: inherit;
    }
    .seg-tab.active[data-seg="efai"] .seg-count {
      background: rgba(43, 53, 127, 0.14);
      color: var(--navy);
    }

    /* Chips de Anos */
    .years-bar {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .years-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .year-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--text-main);
      transition: all 0.15s;
    }

    .year-chip:hover {
      border-color: var(--navy);
    }

    .year-chip.active {
      background: var(--navy);
      border-color: var(--navy);
      color: #FFFFFF;
    }

    .year-chip-count {
      font-size: 0.76rem;
      padding: 1px 7px;
      border-radius: 999px;
      background: var(--surface-alt);
      color: var(--text-sec);
    }

    .year-chip.active .year-chip-count {
      background: rgba(255, 255, 255, 0.22);
      color: #FFFFFF;
    }

    .pending-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #E09F1F;
      display: inline-block;
    }

    .pending-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #FFF8E6;
      border: 1px solid #F2D388;
      color: #6B4D08;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.84rem;
      font-weight: 600;
    }

    /* ==========================================================================
       5. LAYOUT PRINCIPAL (SIDEBAR DE FILTROS + ÁREA DE RESULTADOS)
       ========================================================================== */
    .catalog-layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 28px;
      padding-top: 24px;
      padding-bottom: 56px;
      align-items: start;
    }

    .filters-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 86px;
      max-height: calc(100vh - 106px);
      overflow-y: auto;
    }

    .filters-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .filters-title {
      font-size: 1.05rem;
      font-weight: 800;
    }

    .btn-clear-filters {
      background: transparent;
      border: none;
      color: var(--coral-dark);
      font-size: 0.82rem;
      font-weight: 800;
      text-decoration: underline;
      padding: 4px;
    }

    .btn-clear-filters:disabled {
      opacity: 0.4;
      cursor: default;
      text-decoration: none;
    }

    .filter-group {
      margin-bottom: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .filter-group:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .filter-group-title {
      font-size: 0.76rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-sec);
      margin-bottom: 10px;
    }

    .filter-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      max-height: 210px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .filter-option {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.86rem;
      cursor: pointer;
      padding: 3px 4px;
      border-radius: 8px;
      transition: background 0.12s, opacity 0.15s;
    }

    .filter-option:hover {
      background: var(--surface-alt);
    }

    .filter-option.zero {
      opacity: 0.42;
    }

    .filter-option-left {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.3;
    }

    .filter-option input[type="checkbox"] {
      margin-top: 2px;
      accent-color: var(--navy);
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .filter-facet-count {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-sec);
      background: var(--surface-alt);
      padding: 1px 7px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    /* ==========================================================================
       6. BARRA DE CONTROLES E CHIPS ATIVOS
       ========================================================================== */
    .results-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .results-count {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--navy);
    }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .mobile-filter-btn {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--navy);
      background: var(--surface);
      color: var(--navy);
      font-weight: 800;
      font-size: 0.86rem;
    }

    .sort-select {
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .view-toggle {
      display: inline-flex;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      overflow: hidden;
    }

    .view-btn {
      border: none;
      background: transparent;
      padding: 7px 11px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-sec);
    }

    .view-btn.active {
      background: var(--navy);
      color: #FFFFFF;
    }

    .active-chips-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .active-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--navy);
      color: #FFFFFF;
      font-size: 0.8rem;
      font-weight: 700;
      border: none;
    }

    .active-chip span[aria-hidden] {
      font-size: 1rem;
      line-height: 1;
    }

    /* ==========================================================================
       7. CARDS E LISTA DE PROJETOS
       ========================================================================== */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 20px;
    }

    .projects-grid.list-view {
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .project-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.16s ease, box-shadow 0.16s ease;
      position: relative;
      border-left: 7px solid var(--seg-color, var(--navy));
    }

    .project-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    .card-body {
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 10px;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .card-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .seg-pill {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 3px 9px;
      border-radius: 999px;
    }

    .year-pill {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--surface-alt);
      color: var(--text-sec);
      border: 1px solid var(--border);
    }

    .star-btn {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 999px;
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--text-sec);
      transition: all 0.15s;
    }

    .star-btn:hover {
      border-color: var(--navy);
      color: var(--navy);
    }

    .star-btn.starred {
      background: #FFF6D6;
      border-color: #E5B422;
      color: #C98A00;
    }

    .card-title-btn {
      background: none;
      border: none;
      padding: 0;
      text-align: left;
      font-size: 1.12rem;
      font-weight: 800;
      color: var(--navy);
      line-height: 1.3;
    }

    .card-title-btn:hover {
      text-decoration: underline;
    }

    .card-subtitle {
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--teal);
      margin-top: -4px;
    }

    .card-desc {
      margin: 0;
      font-size: 0.9rem;
      color: var(--text-main);
      line-height: 1.48;
    }

    .card-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.82rem;
      color: var(--text-sec);
      background: var(--surface-alt);
      padding: 10px 12px;
      border-radius: var(--radius-sm);
    }

    .card-meta strong {
      color: var(--text-main);
      font-weight: 700;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: auto;
    }

    .tag-chip {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 8px;
      background: #EEF1FA;
      color: var(--navy);
    }

    .card-footer {
      padding: 11px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #FCFCF6;
    }

    .source-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .source-badge.manual {
      background: #E8F5EA;
      color: #21662B;
    }

    .source-badge.book {
      background: #FFF3DC;
      color: #7D5106;
    }

    .card-open-link {
      background: none;
      border: none;
      color: var(--navy);
      font-size: 0.82rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* Visão em lista compacta */
    .projects-grid.list-view .project-card {
      flex-direction: row;
      align-items: center;
      border-radius: var(--radius-md);
    }
    .projects-grid.list-view .card-body {
      flex-direction: row;
      align-items: center;
      flex-wrap: wrap;
      padding: 14px 18px;
      gap: 14px;
    }
    .projects-grid.list-view .card-top {
      order: 1;
      min-width: 190px;
    }
    .projects-grid.list-view .card-main-info {
      order: 2;
      flex: 1 1 260px;
    }
    .projects-grid.list-view .card-desc {
      display: none;
    }
    .projects-grid.list-view .card-meta {
      order: 3;
      flex: 1 1 240px;
      padding: 6px 10px;
    }
    .projects-grid.list-view .card-tags {
      order: 4;
      margin-top: 0;
    }
    .projects-grid.list-view .card-footer {
      border-top: none;
      border-left: 1px solid var(--border);
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      padding: 12px 16px;
      min-width: 185px;
    }

    .empty-state {
      background: var(--surface);
      border: 1.5px dashed var(--border);
      border-radius: var(--radius-lg);
      padding: 48px 24px;
      text-align: center;
      max-width: 540px;
      margin: 24px auto;
    }

    .empty-state h3 {
      font-size: 1.25rem;
      margin-bottom: 8px;
    }

    .empty-state p {
      color: var(--text-sec);
      margin: 0 0 20px;
    }

    .btn-primary {
      background: var(--navy);
      color: #FFFFFF;
      border: none;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 800;
    }

    /* ==========================================================================
       8. FICHA COMPLETA DO PROJETO (PAINEL LATERAL NA PRÓPRIA PÁGINA)
       ========================================================================== */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(24, 29, 61, 0.55);
      backdrop-filter: blur(3px);
      z-index: 60;
      display: none;
      justify-content: flex-end;
    }

    .drawer-backdrop.open {
      display: flex;
    }

    .project-sheet {
      width: 100%;
      max-width: 920px;
      height: 100%;
      background: var(--cream);
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .sheet-header {
      padding: 24px 28px;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .sheet-deco {
      position: absolute;
      right: -12px;
      bottom: -16px;
      width: 150px;
      height: 150px;
      opacity: 0.22;
      pointer-events: none;
    }

    .sheet-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      position: relative;
      z-index: 1;
    }

    .sheet-kicker {
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      opacity: 0.92;
    }

    .sheet-close-btn {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      border: none;
      background: rgba(255, 255, 255, 0.25);
      color: inherit;
      font-size: 1.3rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .sheet-close-btn:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    .sheet-title {
      font-size: 1.65rem;
      font-weight: 900;
      color: inherit;
      position: relative;
      z-index: 1;
    }

    .sheet-subtitle {
      font-size: 1.02rem;
      font-weight: 700;
      opacity: 0.9;
      margin-top: 4px;
      position: relative;
      z-index: 1;
    }

    .sheet-meta-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      margin-top: 14px;
      font-size: 0.85rem;
      font-weight: 700;
      position: relative;
      z-index: 1;
    }

    .sheet-components-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
      position: relative;
      z-index: 1;
    }

    .sheet-comp-pill {
      font-size: 0.76rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.22);
    }

    .sheet-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
    }

    .sheet-grid {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 24px;
      align-items: start;
    }

    .sheet-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
    }

    .sheet-section-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    /* Passo a passo visual */
    .steps-timeline {
      list-style: none;
      margin: 0;
      padding: 0;
      position: relative;
    }

    .step-item {
      position: relative;
      padding-left: 42px;
      padding-bottom: 18px;
      font-size: 0.94rem;
    }

    .step-item:last-child {
      padding-bottom: 0;
    }

    .step-item:not(:last-child)::before {
      content: '';
      position: absolute;
      left: 14px;
      top: 30px;
      bottom: 2px;
      border-left: 2px dashed var(--seg-color, var(--navy));
      opacity: 0.55;
    }

    .step-num {
      position: absolute;
      left: 0;
      top: 0;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.84rem;
      font-weight: 900;
    }

    /* Bloco lateral Planejamento */
    .plan-item {
      margin-bottom: 14px;
    }
    .plan-item:last-child {
      margin-bottom: 0;
    }
    .plan-label {
      display: block;
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-sec);
      margin-bottom: 4px;
    }
    .plan-value {
      font-size: 0.9rem;
      margin: 0;
    }
    .pills-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .skill-pill {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      color: var(--navy);
    }

    /* Tabela BNCC na ficha */
    .bncc-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    .bncc-table th, .bncc-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }
    .bncc-table tr:last-child td {
      border-bottom: none;
    }
    .bncc-code-btn {
      background: #EEF1FA;
      color: var(--navy);
      border: 1px solid #CFD6F0;
      border-radius: 8px;
      padding: 4px 9px;
      font-size: 0.82rem;
      font-weight: 800;
      white-space: nowrap;
    }
    .bncc-code-btn:hover {
      background: var(--navy);
      color: #FFFFFF;
    }

    /* Habilidades linguísticas */
    .lang-boxes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }
    .lang-box {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px;
    }
    .lang-box-title {
      font-size: 0.76rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--teal);
      margin-bottom: 6px;
    }
    .lang-box p {
      margin: 0;
      font-size: 0.88rem;
    }

    /* Caixa Para o Professor */
    .teacher-box {
      background: var(--navy);
      color: #FFFFFF;
      border-radius: var(--radius-md);
      padding: 20px 22px;
      display: flex;
      align-items: center;
      gap: 18px;
      position: relative;
      overflow: hidden;
    }
    .teacher-sub-img {
      width: 78px;
      height: auto;
      flex-shrink: 0;
    }
    .teacher-box h4 {
      color: var(--lemon);
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .teacher-box p {
      margin: 0;
      font-size: 0.92rem;
      line-height: 1.5;
    }
    .teacher-pending-note {
      margin-top: 10px !important;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 0.8rem !important;
      color: #DCE2FF;
    }

    /* Alternativa de cópia manual caso o iframe bloqueie navigator.clipboard */
    .copy-fallback-bar {
      background: #FFF8E6;
      border-top: 1px solid #F2D388;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .copy-fallback-bar label {
      font-size: 0.8rem;
      font-weight: 800;
      color: #6B4D08;
    }
    .copy-fallback-input {
      flex: 1 1 240px;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1.5px solid #D9B65B;
      background: #FFFFFF;
      font-size: 0.82rem;
      color: var(--text-main);
    }

    /* Rodapé da ficha */
    .sheet-footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .pdf-page-note {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-sec);
    }
    .sheet-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .sheet-btn {
      padding: 7px 12px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--navy);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .sheet-btn:hover {
      border-color: var(--navy);
      background: var(--surface-alt);
    }
    .sheet-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }
    .sheet-btn.primary {
      background: var(--navy);
      color: #FFFFFF;
      border-color: var(--navy);
    }

    /* ==========================================================================
       9. EXPLORADOR DA BNCC & MEUS PROJETOS
       ========================================================================== */
    .subview-section {
      padding: 28px 0 60px;
    }

    .subview-header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }

    .bncc-controls {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 14px;
      margin-top: 16px;
    }

    .bncc-input, .bncc-select {
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: var(--cream);
      font-size: 0.9rem;
    }

    .bncc-en-disclaimer {
      margin-top: 12px;
      font-size: 0.82rem;
      color: var(--text-sec);
      font-style: italic;
    }

    .bncc-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }

    .bncc-card-top {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .bncc-code-tag {
      background: var(--navy);
      color: #FFFFFF;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 3px 10px;
      border-radius: 8px;
    }

    .bncc-meta-tag {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--teal);
      background: var(--surface-alt);
      padding: 3px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .bncc-projects-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
      align-items: center;
    }

    .bncc-proj-link {
      background: var(--cream);
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--navy);
    }
    .bncc-proj-link:hover {
      border-color: var(--navy);
      background: #EEF1FA;
    }

    /* Meus Projetos */
    .saved-year-group {
      margin-bottom: 28px;
    }
    .saved-year-title {
      font-size: 1.15rem;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .saved-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 6px solid var(--seg-color, var(--navy));
      border-radius: var(--radius-md);
      padding: 14px 18px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: var(--shadow-sm);
    }
    .saved-item[draggable="true"] {
      cursor: grab;
    }
    .saved-item.dragging {
      opacity: 0.5;
    }
    .saved-item-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    /* ==========================================================================
       10. RODAPÉ E TOAST DE FEEDBACK
       ========================================================================== */
    .site-footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 28px 0;
      margin-top: auto;
    }

    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .footer-brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .footer-logo {
      height: 36px;
      width: auto;
    }

    .footer-notes {
      font-size: 0.82rem;
      color: var(--text-sec);
      max-width: 680px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--navy);
      color: #FFFFFF;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 700;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 100;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ==========================================================================
       11. RESPONSIVIDADE (360PX A 1920PX)
       ========================================================================== */
    @media (max-width: 1024px) {
      .segment-tabs {
        grid-template-columns: repeat(3, 1fr);
      }
      .catalog-layout {
        grid-template-columns: 260px 1fr;
        gap: 20px;
      }
      .sheet-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .segment-tabs {
        grid-template-columns: 1fr 1fr;
      }
      .catalog-layout {
        grid-template-columns: 1fr;
      }
      .mobile-filter-btn {
        display: inline-flex;
      }
      .filters-panel {
        position: fixed;
        inset: 0 auto 0 0;
        width: 86%;
        max-width: 340px;
        max-height: 100vh;
        border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
        z-index: 70;
        transform: translateX(-105%);
        transition: transform 0.25s ease;
      }
      .filters-panel.mobile-open {
        transform: translateX(0);
      }
      .mobile-filters-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(24, 29, 61, 0.5);
        z-index: 65;
      }
      .mobile-filters-backdrop.open {
        display: block;
      }
      .project-sheet {
        max-width: 100%;
      }
      .sheet-header, .sheet-scroll {
        padding: 18px;
      }
      .bncc-controls {
        grid-template-columns: 1fr;
      }
      .projects-grid.list-view .project-card {
        flex-direction: column;
        align-items: stretch;
      }
      .projects-grid.list-view .card-footer {
        border-left: none;
        border-top: 1px solid var(--border);
        flex-direction: row;
        justify-content: space-between;
      }
    }

    @media (max-width: 480px) {
      .segment-tabs {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .seg-tab { padding: 10px 12px; }
      .seg-tab-sub { display: none; }
      .seg-tab-title { font-size: 0.86rem; }
      .header-inner {
        padding: 12px 16px;
      }
      .container {
        padding: 0 16px;
      }
    }

    /* ==========================================================================
       12. IMPRESSÃO EM A4 (FICHA ÚNICA OU TODAS AS FICHAS DE MEUS PROJETOS)
       ========================================================================== */
    .print-container {
      display: none;
    }

    @media print {
      @page {
        size: A4;
        margin: 14mm;
      }

      body {
        background: #FFFFFF !important;
        color: #000000 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .site-header,
      .segment-nav-wrap,
      .catalog-layout,
      .subview-section,
      .site-footer,
      .drawer-backdrop,
      .mobile-filters-backdrop,
      .toast {
        display: none !important;
      }

      .print-container {
        display: block !important;
      }

      .print-sheet {
        page-break-after: always;
        break-after: page;
        padding-bottom: 10mm;
      }

      .print-sheet:last-child {
        page-break-after: auto;
        break-after: auto;
      }

      .print-sheet .sheet-header {
        border-radius: 12px;
        padding: 16px 20px;
        margin-bottom: 14px;
      }

      .print-sheet .sheet-grid {
        display: grid;
        grid-template-columns: 1.45fr 1fr;
        gap: 14px;
      }

      .print-sheet .sheet-section {
        box-shadow: none;
        padding: 12px 14px;
        margin-bottom: 12px;
        break-inside: avoid;
      }

      .print-sheet .teacher-box {
        padding: 14px 16px;
        break-inside: avoid;
      }

      .print-pdf-footer {
        font-size: 0.78rem;
        color: var(--text-sec);
        margin-top: 8px;
        text-align: right;
      }
    }
  </style>
</head>
<body>
  <!-- ========================================================================
       CABEÇALHO FIXO
       ======================================================================== -->
  <header class="site-header">
    <div class="header-deco" id="header-deco"></div>
    <div class="header-inner">
      <div class="brand-group">
        <span id="header-brand-logo"></span>
        <div class="brand-titles">
          <span class="brand-kicker" id="ui-kicker">Bernoulli Sistema de Ensino · 2027</span>
          <h1 class="brand-title" id="ui-catalog-title">Sugestões de projetos por coleção · Dive.b</h1>
        </div>
      </div>

      <div class="search-box" id="search-box-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="search" id="search-input" class="search-input" aria-label="Buscar projetos" />
        <span class="search-kbd" aria-hidden="true">/</span>
      </div>

      <div class="header-actions">
        <button type="button" class="nav-pill active" id="nav-catalog-btn" data-view="catalog"></button>
        <button type="button" class="nav-pill" id="nav-bncc-btn" data-view="bncc"></button>
        <button type="button" class="nav-pill" id="nav-saved-btn" data-view="saved">
          <span id="nav-saved-label"></span>
          <span class="badge-count" id="saved-count-badge">0</span>
        </button>

        <a href="" target="_blank" rel="noopener noreferrer" class="nav-pill new-tab-link" id="open-new-tab-btn">
          Abrir em nova aba ↗
        </a>

        <div class="lang-switch" role="group" aria-label="Idioma / Language">
          <button type="button" class="lang-btn active" data-lang="pt">PT-BR</button>
          <button type="button" class="lang-btn" data-lang="en">EN</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ========================================================================

      return String(str == null ? "" : str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    window.handleAssetFallback = function(imgEl, key) {
      const list = BRAND_ASSETS[key] || [];
      const nextIdx = Number(imgEl.dataset.tryIdx || 0) + 1;
      if (nextIdx < list.length) {
        imgEl.dataset.tryIdx = String(nextIdx);
        imgEl.src = list[nextIdx];
      } else {
        const span = document.createElement("span");
        span.innerHTML = ASSET_FALLBACK_SVGS[key] || "";
        if (imgEl.parentNode) imgEl.parentNode.replaceChild(span.firstElementChild || span, imgEl);
      }
    };

      const list = BRAND_ASSETS[key] || [];

      return `<img src="${list[0]}" alt="${escapeHtml(alt)}" class="${className}" data-try-idx="0" onerror="window.handleAssetFallback(this, '${key}')" />`;

        const d = String((p.duration && p.duration.pt) || "").toLowerCase();
        if (/semana|m[eê]s|registros|momentos|cuidados|observa/.test(d)) return "long";
        const nums = (d.match(/\d+/g) || []).map(Number);
        const n = nums.length ? nums[0] : 1;
        if (n === 1 && !/1 a 2/.test(d)) return "1";
        if (n <= 3) return "2-3";
        return "4+";
      }
      function durNumber(p) {
        const m = String((p.duration && p.duration.pt) || "").match(/\d+/);
        return m ? Number(m[0]) : 1;
      }

      // Mapeia valores de filtro entre PT e EN (temas, componentes, competências)
      function translateVals(arr, field, from, to) {
        const map = {};
        (DATA.projects || []).forEach(p => {
          const a = (p[field] && p[field][from]) || [], b = (p[field] && p[field][to]) || [];
          a.forEach((v, i) => { if (b[i]) map[v] = b[i]; });
        });
        return arr.map(v => map[v] || v);
      }

      function normalizeText(str) {
        return String(str || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase();
      }

      function formatRichText(str, highlightQuery = "") {
        let html = escapeHtml(str || "").replace(/\*([^*]+)\*/g, "<em>$1</em>");
        if (highlightQuery && highlightQuery.trim().length >= 2) {
          const escapedQ = highlightQuery.trim().replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const re = new RegExp(`(${escapedQ})(?![^<]*>)`, "gi");
          html = html.replace(re, "<mark>$1</mark>");
        }
        return html;
      }

      function showToast(msg) {
        const el = document.getElementById("toast");
        if (!el) return;
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(el._timer);
        el._timer = setTimeout(() => el.classList.remove("show"), 2400);
      }

      function parseHashToState() {
        const raw = window.location.hash.replace(/^#/, "");
        if (!raw) return;
        const params = new URLSearchParams(raw);
        if (params.get("lang") === "en" || params.get("lang") === "pt") state.lang = params.get("lang");
        if (["catalog", "bncc", "saved"].includes(params.get("view"))) state.view = params.get("view");
        if (params.has("seg")) state.seg = params.get("seg") || "all";
        if (params.has("year")) state.year = params.get("year") || "all";
        if (params.has("q")) state.q = params.get("q") || "";
        if (params.has("p")) state.projectId = params.get("p") || null;
        if (params.has("sort")) state.sort = params.get("sort") || "collection";
        if (params.has("mode")) state.viewMode = params.get("mode") || "cards";
        const list = (k) => params.get(k) ? params.get(k).split("|").filter(Boolean) : [];
        state.durations = list("dur");
        state.themes = list("theme");
        state.components = list("comp");
        state.skills21 = list("skill");
        state.sources = list("src");
        state.hasRW = params.get("rw") === "1";
        if (params.has("bncc")) state.bnccQuery = params.get("bncc") || "";
        if (!params.has("p")) state.projectId = null;
      }

      function syncStateToHash(replace = false) {
        const params = new URLSearchParams();
        if (state.lang !== "pt") params.set("lang", state.lang);
        if (state.view !== "catalog") params.set("view", state.view);
        if (state.seg !== "all") params.set("seg", state.seg);
        if (state.year !== "all") params.set("year", state.year);
        if (state.q) params.set("q", state.q);
        if (state.sort !== "collection") params.set("sort", state.sort);
        if (state.viewMode !== "cards") params.set("mode", state.viewMode);
        if (state.durations.length) params.set("dur", state.durations.join("|"));
        if (state.themes.length) params.set("theme", state.themes.join("|"));
        if (state.components.length) params.set("comp", state.components.join("|"));
        if (state.skills21.length) params.set("skill", state.skills21.join("|"));
        if (state.sources.length) params.set("src", state.sources.join("|"));
        if (state.hasRW) params.set("rw", "1");
        if (state.view === "bncc" && state.bnccQuery) params.set("bncc", state.bnccQuery);
        if (state.projectId) params.set("p", state.projectId);
        const nextHash = params.toString() ? `#${params.toString()}` : "";
        try {
          if (replace) {
            history.replaceState(null, "", nextHash || window.location.pathname + window.location.search);
          } else {
            window.location.hash = nextHash;
          }
        } catch {}
        updateNewTabLinks();
      }

      function matchesFilters(p, ignoreFacet = null) {
        const lang = state.lang;
        if (state.seg !== "all" && p.segment !== state.seg) return false;
        if (state.year !== "all" && p.year !== state.year) return false;
        if (ignoreFacet !== "durations" && state.durations.length > 0) {
          if (!state.durations.includes(durBucket(p))) return false;
        }
        if (ignoreFacet !== "themes" && state.themes.length > 0) {
          const th = (p.themes && p.themes[lang]) || [];
          if (!state.themes.some(t => th.includes(t))) return false;
        }
        if (ignoreFacet !== "components" && state.components.length > 0) {
          const cp = (p.components && p.components[lang]) || [];
          if (!state.components.some(c => cp.includes(c))) return false;
        }
        if (ignoreFacet !== "skills21" && state.skills21.length > 0) {
          const sk = (p.skills21 && p.skills21[lang]) || [];
          if (!state.skills21.some(s => sk.includes(s))) return false;
        }
        if (ignoreFacet !== "sources" && state.sources.length > 0) {
          if (!state.sources.includes(p.steps_source)) return false;
        }
        if (ignoreFacet !== "hasRW" && state.hasRW) {
          if (!p.language || !p.language.reading_writing || !p.language.reading_writing[lang]) return false;
        }
        if (state.q.trim()) {
          const q = normalizeText(state.q.trim());
          const hay = normalizeText([
            p.name,
            p.subtitle_pt,
            p.description && p.description.pt, p.description && p.description.en,
            ((p.steps && p.steps[lang]) || []).join(" "),
            p.teacher_tip && p.teacher_tip[lang],
            ((p.skills21 && p.skills21[lang]) || []).join(" "),
            p.materials && p.materials[lang],
            p.final_product && p.final_product[lang],
            p.language && p.language.target_language && p.language.target_language[lang],
            (p.bncc || []).join(" "),
            ((p.themes && p.themes[lang]) || []).join(" "),
            ((p.components && p.components[lang]) || []).join(" ")
          ].join(" "));
          if (!hay.includes(q)) return false;
        }
        return true;
      }

      function getFilteredProjects() {
        const list = (DATA.projects || []).filter(p => matchesFilters(p));
        if (state.sort === "alpha") {
          return [...list].sort((a, b) => a.name.localeCompare(b.name, state.lang));
        }
        if (state.sort === "duration") {
          return [...list].sort((a, b) => (DUR_ORDER.indexOf(durBucket(a)) - DUR_ORDER.indexOf(durBucket(b))) || (durNumber(a) - durNumber(b)) || (a.n - b.n));
        }
        return [...list].sort((a, b) => a.n - b.n);
      }

      function renderFiltersSidebar() {
        const t = UI[state.lang];
        const lang = state.lang;
        document.getElementById("ui-filters-title").textContent = t.filtersTitle;
        const clearBtn = document.getElementById("btn-clear-filters");
        clearBtn.textContent = t.clearFilters;

        const hasAnyFilter = state.seg !== "all" || state.year !== "all" || state.q.trim() !== "" ||
          state.durations.length > 0 || state.themes.length > 0 || state.components.length > 0 ||
          state.skills21.length > 0 || state.sources.length > 0 || state.hasRW;
        clearBtn.disabled = !hasAnyFilter;

        const allProjs = DATA.projects || [];
        const collectFacet = (facetName, extractor) => {
          const valuesSet = new Set();
          allProjs.forEach(p => extractor(p).forEach(v => { if (v) valuesSet.add(v); }));
          const baseMatches = allProjs.filter(p => matchesFilters(p, facetName));
          return [...valuesSet].sort((a, b) => a.localeCompare(b, lang)).map(val => ({
            val,
            count: baseMatches.filter(p => extractor(p).includes(val)).length
          }));
        };

        const durBase = allProjs.filter(p => matchesFilters(p, "durations"));
        const durItems = DUR_ORDER.map(k => ({ val: k, label: DUR_LABELS[lang][k], count: durBase.filter(p => durBucket(p) === k).length }));
        const themeItems = collectFacet("themes", p => (p.themes && p.themes[lang]) || []);
        const compItems = collectFacet("components", p => (p.components && p.components[lang]) || []);
        const skillItems = collectFacet("skills21", p => (p.skills21 && p.skills21[lang]) || []);

        const sourceBase = allProjs.filter(p => matchesFilters(p, "sources"));
        const sourceItems = [
          { val: "teachers_manual", label: t.sourceManual, count: sourceBase.filter(p => p.steps_source === "teachers_manual").length },
          { val: "book_description", label: t.sourceBook, count: sourceBase.filter(p => p.steps_source === "book_description").length }
        ];

        const rwBase = allProjs.filter(p => matchesFilters(p, "hasRW"));
        const rwCount = rwBase.filter(p => p.language && p.language.reading_writing && p.language.reading_writing[lang]).length;

        const renderGroup = (title, facetKey, items, selectedArr) => {
          if (!items.length) return "";
          return `
            <div class="filter-group">
              <div class="filter-group-title">${escapeHtml(title)}</div>
              <div class="filter-list">
                ${items.map(it => {
                  const checked = selectedArr.includes(it.val);
                  const zeroCls = !checked && it.count === 0 ? "zero" : "";
                  return `
                    <label class="filter-option ${zeroCls}">
                      <span class="filter-option-left">
                        <input type="checkbox" data-facet="${facetKey}" value="${escapeHtml(it.val)}" ${checked ? "checked" : ""} />
                        <span>${escapeHtml(it.label || it.val)}</span>
                      </span>
                      <span class="filter-facet-count">${it.count}</span>
                    </label>
                  `;
                }).join("")}
              </div>
            </div>
          `;
        };

        document.getElementById("filters-container").innerHTML =
          renderGroup(t.filterDuration, "durations", durItems, state.durations) +
          renderGroup(t.filterThemes, "themes", themeItems, state.themes) +
          renderGroup(t.filterComponents, "components", compItems, state.components) +
          renderGroup(t.filterSkills21, "skills21", skillItems, state.skills21) +
          renderGroup(t.filterSource, "sources", sourceItems, state.sources) +
          `
            <div class="filter-group">
              <div class="filter-group-title">${escapeHtml(t.filterLang)}</div>
              <label class="filter-option ${!state.hasRW && rwCount === 0 ? "zero" : ""}">
                <span class="filter-option-left">
                  <input type="checkbox" data-facet="hasRW" value="1" ${state.hasRW ? "checked" : ""} />
                  <span>${escapeHtml(t.hasRWLabel)}</span>
                </span>
                <span class="filter-facet-count">${rwCount}</span>
              </label>
            </div>
          `;
      }

      function formatProjectPlainText(p) {
        const t = UI[state.lang];
        const seg = SEG_MAP[p.segment];
        const year = YEAR_MAP[p.year];
        const clean = (s) => String(s || "").replace(/\*/g, "");
        const lines = [
          `${p.name}${state.lang === "pt" && p.subtitle_pt ? " (" + p.subtitle_pt + ")" : ""}`,
          `${seg ? seg.title[state.lang] : ""} · ${year ? year.label[state.lang] : ""}`,
          `${clean(p.location[state.lang])} | ${clean(p.duration[state.lang])}`,
          "",
          `${t.sheetAbout.toUpperCase()}:`,
          clean(p.description[state.lang]),
          "",
          `${t.sheetSteps.toUpperCase()}:`,
          ...p.steps[state.lang].map((st, idx) => `${idx + 1}. ${clean(st)}`),
          "",
          `${t.sheetMaterials}: ${clean(p.materials[state.lang])}`,
          `${t.finalProductLabel}: ${clean(p.final_product[state.lang])}`,
          `${t.sheetAssessment}: ${clean(p.assessment[state.lang])}`,
          `BNCC: ${p.bncc.join(", ")}`,
          `${t.langTarget}: ${clean(p.language.target_language[state.lang])}`,
          `${t.sheetTeacher}: ${clean(p.teacher_tip[state.lang])}`

        const entries = Object.entries(DATA.bncc || {});
        const stages = [...new Set(entries.map(([, v]) => v.stage && v.stage[state.lang]).filter(Boolean))];
        const comps = [...new Set(entries.map(([, v]) => v.component && v.component[state.lang]).filter(Boolean))].sort((a, b) => a.localeCompare(b, state.lang));

        const stageSelect = document.getElementById("bncc-stage-select");
        stageSelect.innerHTML = `<option value="all">${escapeHtml(t.bnccAllStages)}</option>` +
          stages.map(s => `<option value="${escapeHtml(s)}" ${state.bnccStage === s ? "selected" : ""}>${escapeHtml(s)}</option>`).join("");

        const compSelect = document.getElementById("bncc-comp-select");
        compSelect.innerHTML = `<option value="all">${escapeHtml(t.bnccAllComps)}</option>` +
          comps.map(c => `<option value="${escapeHtml(c)}" ${state.bnccComp === c ? "selected" : ""}>${escapeHtml(c)}</option>`).join("");

        const q = normalizeText(state.bnccQuery.trim());
        const filtered = entries.filter(([code, info]) => {
          const stg = (info.stage && info.stage[state.lang]) || "";
          const cmp = (info.component && info.component[state.lang]) || "";
          if (state.bnccStage !== "all" && stg !== state.bnccStage) return false;
          if (state.bnccComp !== "all" && cmp !== state.bnccComp) return false;
          if (q) {
            const hay = normalizeText(`${code} ${stg} ${cmp} ${(info.text && info.text[state.lang]) || ""}`);
            if (!hay.includes(q)) return false;

          return true;

        document.getElementById("bncc-results-count").textContent = t.bnccCount(filtered.length);

        const listEl = document.getElementById("bncc-list");

      function exportSavedToCsv() {
        const lang = state.lang;
        const clean = (s) => String(s || "").replace(/\*/g, "").replace(/"/g, '""');
        const headers = lang === "pt"
          ? ["Numero", "Segmento", "Ano", "Nome", "Subtitulo_PT", "Localizacao", "Duracao", "Produto_Final", "Componentes", "Temas", "BNCC", "Pagina_PDF"]
          : ["Number", "Segment", "Grade", "Name", "Location", "Duration", "Final_Product", "Components", "Themes", "BNCC", "PDF_Page"];

        const rows = [headers.map(h => `"${h}"`).join(";")];
        state.savedIds.map(id => PROJ_MAP[id]).filter(Boolean).forEach(p => {
          const seg = SEG_MAP[p.segment];
          const yr = YEAR_MAP[p.year];
          const cols = lang === "pt" ? [
            p.n,
            seg ? seg.title.pt : "",
            yr ? yr.label.pt : "",
            p.name,
            p.subtitle_pt || "",
            p.location.pt,
            p.duration.pt,
            p.final_product.pt,
            (p.components.pt || []).join(", "),
            (p.themes.pt || []).join(", "),
            (p.bncc || []).join(", "),
            p.pdf_page.pt
          ] : [
            p.n,
            seg ? seg.title.en : "",
            yr ? yr.label.en : "",
            p.name,
            p.location.en,
            p.duration.en,
            p.final_product.en,
            (p.components.en || []).join(", "),
            (p.themes.en || []).join(", "),
            (p.bncc || []).join(", "),
            p.pdf_page.en
          ];
          rows.push(cols.map(c => `"${clean(c)}"`).join(";"));
        });

        const blob = new Blob(["\uFEFF" + rows.join("\n")], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `diveb_meus_projetos_${lang}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      function printProjects(projectsList) {
        const printContainer = document.getElementById("print-container");
        printContainer.innerHTML = projectsList.map(p => `
          <div class="print-sheet">
            ${buildProjectSheetHtml(p, true)}
          </div>
        `).join("");
        const imgs = [...printContainer.querySelectorAll("img")].filter(i => !i.complete);
        Promise.all(imgs.map(i => new Promise(res => { i.onload = i.onerror = res; }))).then(() => {
          try { window.print(); } catch { showToast(state.lang === "pt" ? "Use 'Abrir em nova aba' para imprimir." : "Use 'Open in new tab' to print."); }
        });
      }

      window.addEventListener("afterprint", () => { document.getElementById("print-container").innerHTML = ""; });

      function toggleSavedProject(id) {
        const idx = state.savedIds.indexOf(id);
        if (idx === -1) {
          state.savedIds.push(id);
        } else {
          state.savedIds.splice(idx, 1);
        }
        saveSavedIds(state.savedIds);
        renderAll();
      }

      function moveSavedItemInYear(id, direction) {
        const proj = PROJ_MAP[id];
        if (!proj) return;
        const sameYearIds = state.savedIds.filter(sid => PROJ_MAP[sid] && PROJ_MAP[sid].year === proj.year);
        const pos = sameYearIds.indexOf(id);
        const swapPos = direction === "up" ? pos - 1 : pos + 1;
        if (swapPos < 0 || swapPos >= sameYearIds.length) return;

        const targetId = sameYearIds[swapPos];
        const globalA = state.savedIds.indexOf(id);
        const globalB = state.savedIds.indexOf(targetId);
        [state.savedIds[globalA], state.savedIds[globalB]] = [state.savedIds[globalB], state.savedIds[globalA]];
        saveSavedIds(state.savedIds);
        renderSavedProjects();
      }

      function setupEvents() {
        document.getElementById("header-deco").innerHTML = renderOrganicGraphic("sub02_jpg", "header-deco");
        document.getElementById("header-brand-logo").innerHTML = renderBrandAsset("diveb_color", "Dive.b", "brand-logo");
        document.getElementById("footer-brand-logo").innerHTML = renderBrandAsset("bern_navy", "Bernoulli Sistema de Ensino", "footer-logo");
        document.getElementById("footer-diveb-logo").innerHTML = renderBrandAsset("diveb_color", "Dive.b", "footer-logo");

        document.querySelectorAll(".lang-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            const from = state.lang, to = btn.dataset.lang;
            if (from === to) return;
            state.themes = translateVals(state.themes, "themes", from, to);
            state.components = translateVals(state.components, "components", from, to);
            state.skills21 = translateVals(state.skills21, "skills21", from, to);
            state.lang = to;
            saveSavedLang(state.lang);
            state.bnccStage = "all";
            state.bnccComp = "all";
            syncStateToHash();
            renderAll();
          });
        });

        document.querySelectorAll(".nav-pill[data-view]").forEach(btn => {
          btn.addEventListener("click", () => {
            state.view = btn.dataset.view;
            state.projectId = null;
            syncStateToHash();
            renderAll();
          });
        });

        let searchTimer = null;
        document.getElementById("search-input").addEventListener("input", (e) => {
          clearTimeout(searchTimer);
          searchTimer = setTimeout(() => {
            state.q = e.target.value;
            syncStateToHash(true);
            renderFiltersSidebar();
            renderCatalogResults();
          }, 150);
        });

        document.addEventListener("keydown", (e) => {
          if (e.key === "/" && !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) {
            e.preventDefault();
            if (state.view !== "catalog") {
              state.view = "catalog";
              syncStateToHash();
              renderAll();
            }
            document.getElementById("search-input").focus();
          }
          if (e.key === "Escape") {
            if (state.projectId) {
              state.projectId = null;
              syncStateToHash();
              renderAll();
            }
            document.getElementById("filters-panel").classList.remove("mobile-open");
            document.getElementById("mobile-filters-backdrop").classList.remove("open");
          }
        });

        document.getElementById("segment-tabs").addEventListener("click", (e) => {
          const btn = e.target.closest(".seg-tab");
          if (!btn) return;
          state.seg = btn.dataset.seg;
          state.year = "all";
          syncStateToHash();
          renderAll();
        });

        document.getElementById("years-chips").addEventListener("click", (e) => {
          const btn = e.target.closest(".year-chip");
          if (!btn) return;
          state.year = btn.dataset.year;
          syncStateToHash();
          renderAll();
        });

        document.getElementById("filters-container").addEventListener("change", (e) => {
          const input = e.target;
          if (!input.matches("input[type='checkbox']")) return;
          const facet = input.dataset.facet;
          if (facet === "hasRW") {
            state.hasRW = input.checked;
          } else {
            const val = input.value;
            if (input.checked) {
              if (!state[facet].includes(val)) state[facet].push(val);
            } else {
              state[facet] = state[facet].filter(v => v !== val);
            }
          }
          syncStateToHash();
          renderFiltersSidebar();
          renderCatalogResults();
        });

        const clearAllFilters = () => {
          state.seg = "all";
          state.year = "all";
          state.q = "";
          state.durations = [];
          state.themes = [];
          state.components = [];
          state.skills21 = [];
          state.sources = [];
          state.hasRW = false;
          syncStateToHash();
          renderAll();
        };
        document.getElementById("btn-clear-filters").addEventListener("click", clearAllFilters);

        document.getElementById("sort-select").addEventListener("change", (e) => {
          state.sort = e.target.value;
          syncStateToHash();
          renderCatalogResults();
        });

        document.getElementById("view-cards-btn").addEventListener("click", () => {
          state.viewMode = "cards";
          syncStateToHash();
          renderCatalogResults();
        });

        document.getElementById("view-list-btn").addEventListener("click", () => {
          state.viewMode = "list";
          syncStateToHash();
          renderCatalogResults();
        });

        document.getElementById("active-chips-bar").addEventListener("click", (e) => {
          const btn = e.target.closest(".active-chip");
          if (!btn) return;
          const type = btn.dataset.removeType;
          const val = btn.dataset.removeVal;
          if (type === "seg") { state.seg = "all"; state.year = "all"; }
          else if (type === "year") { state.year = "all"; }
          else if (type === "q") { state.q = ""; }
          else if (type === "hasRW") { state.hasRW = false; }
          else if (Array.isArray(state[type])) {
            state[type] = state[type].filter(v => v !== val);
          }
          syncStateToHash();
          renderAll();
        });

        document.getElementById("mobile-filter-btn").addEventListener("click", () => {
          document.getElementById("filters-panel").classList.add("mobile-open");
          document.getElementById("mobile-filters-backdrop").classList.add("open");
        });
        document.getElementById("mobile-filters-backdrop").addEventListener("click", () => {
          document.getElementById("filters-panel").classList.remove("mobile-open");
          document.getElementById("mobile-filters-backdrop").classList.remove("open");
        });

        document.body.addEventListener("click", (e) => {
          if (e.target.closest("#empty-clear-btn")) {
            clearAllFilters();
            return;
          }

          const starBtn = e.target.closest("[data-star-id]");
          if (starBtn) {
            e.stopPropagation();
            toggleSavedProject(starBtn.dataset.starId);
            return;
          }

          const openBtn = e.target.closest("[data-open-id]");
          if (openBtn) {
            state.projectId = openBtn.dataset.openId;
            syncStateToHash();
            openProjectSheet(state.projectId);
            return;
          }

          if (e.target.closest("#sheet-close-btn") || e.target === document.getElementById("sheet-backdrop")) {
            state.projectId = null;
            syncStateToHash();
            closeProjectSheetDom();
            return;
          }

          const navBtn = e.target.closest("[data-nav-id]");
          if (navBtn) {
            state.projectId = navBtn.dataset.navId;
            syncStateToHash();
            openProjectSheet(state.projectId);
            return;
          }

          const bnccBtn = e.target.closest("[data-bncc-code]");
          if (bnccBtn) {
            const code = bnccBtn.dataset.bnccCode;
            state.projectId = null;
            state.view = "bncc";
            state.bnccQuery = code;
            state.bnccStage = "all";
            state.bnccComp = "all";
            syncStateToHash();
            renderAll();
            return;
          }

          if (e.target.closest("#sheet-copy-link")) {
            copyTextWithIframeFallback(window.location.href, UI[state.lang].copiedLinkMsg);
            return;
          }

          if (e.target.closest("#sheet-copy-text") && state.projectId) {
            const p = PROJ_MAP[state.projectId];
            if (p) {
              copyTextWithIframeFallback(formatProjectPlainText(p), UI[state.lang].copiedTextMsg);
            }
            return;
          }

          if (e.target.closest("#sheet-print-btn") && state.projectId) {
            const p = PROJ_MAP[state.projectId];
            if (p) printProjects([p]);
            return;
          }

          const moveBtn = e.target.closest("[data-move]");
          if (moveBtn) {
            moveSavedItemInYear(moveBtn.dataset.id, moveBtn.dataset.move);
            return;
          }
        });

        document.getElementById("bncc-search-input").addEventListener("input", (e) => {
          state.bnccQuery = e.target.value;
          syncStateToHash(true);
          renderBnccExplorer();
        });
        document.getElementById("bncc-stage-select").addEventListener("change", (e) => {
          state.bnccStage = e.target.value;
          syncStateToHash();
          renderBnccExplorer();
        });
        document.getElementById("bncc-comp-select").addEventListener("change", (e) => {
          state.bnccComp = e.target.value;
          syncStateToHash();
          renderBnccExplorer();
        });

        document.getElementById("btn-export-csv").addEventListener("click", exportSavedToCsv);
        document.getElementById("btn-print-saved").addEventListener("click", () => {
          const list = state.savedIds.map(id => PROJ_MAP[id]).filter(Boolean);
          if (list.length > 0) printProjects(list);
        });

        let draggedId = null;
        document.getElementById("saved-container").addEventListener("dragstart", (e) => {
          const item = e.target.closest(".saved-item");
          if (!item) return;
          draggedId = item.dataset.savedId;
          item.classList.add("dragging");
        });
        document.getElementById("saved-container").addEventListener("dragend", (e) => {
          const item = e.target.closest(".saved-item");
          if (item) item.classList.remove("dragging");
          draggedId = null;
        });
        document.getElementById("saved-container").addEventListener("dragover", (e) => {
          e.preventDefault();
        });
        document.getElementById("saved-container").addEventListener("drop", (e) => {
          e.preventDefault();
          const targetItem = e.target.closest(".saved-item");
          if (!targetItem || !draggedId || targetItem.dataset.savedId === draggedId) return;
          const targetId = targetItem.dataset.savedId;
          const fromIdx = state.savedIds.indexOf(draggedId);
          const toIdx = state.savedIds.indexOf(targetId);
          if (fromIdx !== -1 && toIdx !== -1) {
            state.savedIds.splice(fromIdx, 1);
            state.savedIds.splice(toIdx, 0, draggedId);
            saveSavedIds(state.savedIds);
            renderSavedProjects();
          }
        });

        window.addEventListener("hashchange", () => {
          parseHashToState();
          renderAll();
        });
      }

      function renderAll() {
        const t = UI[state.lang];
        document.documentElement.lang = state.lang === "pt" ? "pt-BR" : "en";
        document.getElementById("ui-kicker").textContent = t.kicker;
        document.getElementById("ui-catalog-title").textContent = t.catalogTitle;

        const searchInput = document.getElementById("search-input");
        searchInput.placeholder = t.searchPlaceholder;
        if (searchInput.value !== state.q) searchInput.value = state.q;

        document.getElementById("nav-catalog-btn").textContent = t.navCatalog;
        document.getElementById("nav-bncc-btn").textContent = t.navBncc;
        document.getElementById("nav-saved-label").textContent = t.navSaved;
        document.getElementById("saved-count-badge").textContent = String(state.savedIds.filter(id => PROJ_MAP[id]).length);

        const newTabBtn = document.getElementById("open-new-tab-btn");
        if (newTabBtn) {
          newTabBtn.textContent = t.openNewTab;
          newTabBtn.href = window.location.href;
        }

        document.querySelectorAll(".nav-pill[data-view]").forEach(btn => {
          btn.classList.toggle("active", btn.dataset.view === state.view);
        });
        document.querySelectorAll(".lang-btn").forEach(btn => {
          btn.classList.toggle("active", btn.dataset.lang === state.lang);
        });

        document.getElementById("search-box-wrap").style.visibility = state.view === "catalog" ? "visible" : "hidden";
        document.getElementById("segment-nav-wrap").hidden = state.view !== "catalog";
        document.getElementById("view-catalog").hidden = state.view !== "catalog";
        document.getElementById("view-bncc").hidden = state.view !== "bncc";
        document.getElementById("view-saved").hidden = state.view !== "saved";

        if (DATA.meta) {
          if (DATA.meta.version) document.getElementById("footer-version").textContent = DATA.meta.version;
          if (DATA.meta.generated) document.getElementById("footer-generated").textContent = DATA.meta.generated;
          if (DATA.meta.notes && DATA.meta.notes[state.lang]) document.getElementById("footer-notes").textContent = DATA.meta.notes[state.lang];
        }

        if (state.view === "catalog") {
          renderSegmentAndYearNav();
          renderFiltersSidebar();
          renderCatalogResults();
        } else if (state.view === "bncc") {
          renderBnccExplorer();
        } else if (state.view === "saved") {
          renderSavedProjects();
        }

        if (state.projectId && PROJ_MAP[state.projectId]) {
          openProjectSheet(state.projectId);
        } else {
          closeProjectSheetDom();
        }
      }

      parseHashToState();
      setupEvents();
      renderAll();
    }
  </script>
</body>
</html>
